<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Book of Nights">
<meta name="theme-color" content="#0b1124">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>The Book of Nights</title>
<style>
@font-face{font-family:Fraunces;src:url(fonts/Fraunces-SemiBold.woff) format("woff");font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:Fraunces;src:url(fonts/Fraunces-SemiBoldItalic.woff) format("woff");font-weight:600;font-style:italic;font-display:swap}
@font-face{font-family:Alegreya;src:url(fonts/Alegreya-Regular.woff) format("woff");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:Alegreya;src:url(fonts/Alegreya-Italic.woff) format("woff");font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:Alegreya;src:url(fonts/Alegreya-Bold.woff) format("woff");font-weight:700;font-style:normal;font-display:swap}
:root{
  --navy:#0b1124; --navy2:#10182F; --ink:#1D2440; --gold:#F5C76B; --gold2:#e9b04a; --cream:#F6EEDC;
  --text:#f4f1ea; --muted:#a9b0c8; --leather:#6b3f22; --leather2:#4a2a16;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--navy);color:var(--text);font-family:Alegreya,Georgia,serif;font-size:18px;line-height:1.45;
  background-image:
   radial-gradient(1px 1px at 12% 18%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 72% 12%,#fff6 50%,transparent 51%),
   radial-gradient(1.5px 1.5px at 42% 8%,#ffe6a8aa 50%,transparent 51%),radial-gradient(1px 1px at 88% 34%,#fff5 50%,transparent 51%),
   radial-gradient(1px 1px at 22% 56%,#fff4 50%,transparent 51%),radial-gradient(1.5px 1.5px at 64% 66%,#ffe6a888 50%,transparent 51%),
   radial-gradient(1px 1px at 8% 84%,#fff5 50%,transparent 51%),radial-gradient(1px 1px at 92% 78%,#fff4 50%,transparent 51%),
   radial-gradient(ellipse at 50% -20%,#1d2a55 0%,var(--navy) 60%);
  background-attachment:fixed;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;font-style:italic;color:var(--gold);margin:0}
.wrap{max-width:1440px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) clamp(16px,4vw,64px) 56px}

/* ---------- shared bits ---------- */
#sky{position:fixed;inset:0;z-index:0;pointer-events:none}
.btn{border:0;border-radius:999px;padding:14px 26px;background:linear-gradient(180deg,#ffe2a1,#f0b956 55%,#d9973a);color:#3a2208;font-family:Fraunces,serif;font-weight:600;font-size:18px;box-shadow:0 6px 0 #8f5d1f,0 10px 30px #f5c76b40;letter-spacing:.01em}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 #8f5d1f}
.btn.ghost{background:#ffffff14;color:var(--text);box-shadow:none;border:1px solid #ffffff2e}
.err{color:#ffc7bd;min-height:24px;margin-top:12px;font-size:16px;text-align:center}
.eyebrow{font-family:Fraunces,serif;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}

/* ---------- lock ---------- */
#lock{position:fixed;inset:0;z-index:5;display:grid;grid-template-columns:minmax(0,1fr);align-items:center;justify-items:start;
  padding:24px clamp(24px,7vw,120px);background:#070b1a url(art/lock-wide.webp) center/cover no-repeat;overflow:hidden}
#lock::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 60% 70% at 22% 50%,#070b1acc 0%,#070b1a66 55%,transparent 80%);pointer-events:none}
.lockcard{position:relative;z-index:2;width:min(440px,100%);text-align:center}
.lockcard .mark{display:block;width:84px;height:84px;margin:0 auto 14px;border-radius:20px;box-shadow:0 10px 40px #f5c76b55}
.lockcard h1{font-size:clamp(40px,5.2vw,64px);line-height:1;margin:0 0 10px;text-shadow:0 0 28px #f5c76b66}
.lockcard p{color:#d9dcef;margin:0 0 24px;font-size:18px}
.plaque{display:flex;gap:10px;align-items:center;padding:8px 8px 8px 18px;border-radius:999px;background:#0b1124d9;border:1.5px solid #f5c76b88;box-shadow:inset 0 0 0 4px #f5c76b14,0 14px 40px #0009}
.plaque .kh{font-size:20px;opacity:.9}
.plaque input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:19px;padding:10px 4px}
.plaque input::placeholder{color:#9aa2c4}
.plaque:focus-within{border-color:var(--gold);box-shadow:inset 0 0 0 4px #f5c76b22,0 0 0 4px #f5c76b2a,0 14px 40px #0009}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
#flash{position:fixed;inset:0;z-index:40;pointer-events:none;background:radial-gradient(circle at 50% 50%,#fff3c8 0%,#f5c76b 30%,#0b1124 75%);opacity:0;transition:opacity .7s}
#flash.on{opacity:1}
@media (orientation:portrait){#lock{background-image:url(art/lock-tall.webp);justify-items:center;align-items:start;padding-top:max(10vh,env(safe-area-inset-top))}
  #lock::after{background:linear-gradient(#070b1ae6 0%,#070b1a99 45%,transparent 70%)}}

/* ---------- home page ---------- */
#home{position:relative;z-index:1;min-height:100vh;background:#070b1a}
#home::before{content:"";position:absolute;left:0;right:0;top:0;height:max(100vh,760px);z-index:0;pointer-events:none;background:linear-gradient(180deg,#070b1a00 0%,#070b1acc 42%,#070b1a 70%),url(art/home-sky.webp) center top/cover no-repeat}
.wrap{position:relative;z-index:1;max-width:1320px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) clamp(16px,4vw,56px) 64px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:clamp(20px,4vw,40px)}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:46px;height:46px;border-radius:12px;box-shadow:0 6px 20px #0008}
.brand b{display:block;font-family:Fraunces,serif;font-style:italic;font-weight:600;color:var(--gold);font-size:22px;line-height:1.1}
.brand small{display:block;color:#b9bfd9;font-size:14px}
.stitchbar{display:flex;align-items:center;gap:10px;color:#c7cbe0;font-size:14px}
.stitchbar .st{display:flex;gap:5px}
.stitchbar .st i{width:16px;height:4px;border-radius:3px;background:#ffffff26}
.stitchbar .st i.on{background:var(--gold);box-shadow:0 0 8px #f5c76bcc}
.pill{font-family:Fraunces,serif;font-size:13px;color:var(--gold);border:1px solid #f5c76b66;border-radius:999px;padding:5px 12px;background:#0b112499}

/* tonight hero */
.hero{display:grid;grid-template-columns:minmax(220px,340px) 1fr;gap:clamp(22px,4vw,56px);align-items:center;margin:6px 0 clamp(36px,6vw,64px)}
.hero .cover{position:relative;aspect-ratio:2/3;border-radius:18px;overflow:hidden;background:#141d3c center/cover no-repeat;cursor:pointer;
  box-shadow:0 0 0 2px #f5c76baa,0 0 60px #f5c76b4d,0 30px 60px #000a;transform:rotate(-1.2deg);transition:transform .35s}
.hero .cover:hover{transform:rotate(0) scale(1.02)}
@media (prefers-reduced-motion:no-preference){.hero .cover{animation:glow 4s ease-in-out infinite}}
@keyframes glow{50%{box-shadow:0 0 0 2px #f5c76bdd,0 0 90px #f5c76b77,0 30px 60px #000a}}
.hero .info h2{font-size:clamp(34px,4.6vw,62px);line-height:1.04;margin:10px 0 12px;text-shadow:0 2px 20px #0009}
.hero .info .sub{color:#d3d7ec;font-size:clamp(17px,1.6vw,20px);margin-bottom:24px}
.hero .actions{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.hero .count{font-family:Fraunces,serif;font-size:clamp(26px,3vw,36px);color:var(--text);font-variant-numeric:tabular-nums}
.hero .count small{display:block;font-size:14px;color:#aab1cf;font-family:Alegreya,serif}

/* shelves: a real calendar (7 columns) on wide screens, a day-by-day list on phones */
.shelf{margin-bottom:clamp(34px,5vw,56px)}
.shelf-head{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;margin-bottom:14px}
.shelf-head h3{font-size:clamp(24px,2.6vw,32px)}
.shelf-head span{color:#aab1cf;font-size:15px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:clamp(8px,1.4vw,18px)}
.card{position:relative;display:flex;flex-direction:column;gap:8px;padding:0;border:0;background:none;text-align:left;color:inherit;min-width:0}
.card .day{display:flex;justify-content:center;align-items:baseline;gap:6px;font-family:Fraunces,serif;font-size:13px;color:#c7cbe0;letter-spacing:.08em}
.card .day b{font-size:19px;color:var(--text);letter-spacing:0}
.card.today .day b,.card.today .day{color:var(--gold)}
.card .art{position:relative;aspect-ratio:2/3;border-radius:14px;overflow:hidden;background:#141d3c center/cover no-repeat;box-shadow:0 12px 30px #0008,0 0 0 1px #ffffff1c;transition:transform .25s,box-shadow .25s}
.card:hover .art,.card:focus-visible .art{transform:translateY(-6px);box-shadow:0 20px 40px #000a,0 0 0 2px #f5c76b99}
.card.today .art{box-shadow:0 0 0 2px var(--gold),0 0 34px #f5c76b66,0 12px 30px #0008}
.card .chip{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);white-space:nowrap;z-index:2;font-size:12px;font-family:Fraunces,serif;background:#070b1acc;border:1px solid #f5c76b66;color:var(--gold);border-radius:999px;padding:2px 9px}
.card.done .chip{background:var(--gold);color:#2a1a06;border-color:var(--gold);font-weight:600}
.card.tomorrow .art{filter:saturate(.75) brightness(.7)}
.card.later .art{background-image:url(art/card-mystery.webp)!important}
.card .meta{display:none}
.titlecard{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;padding:12%;text-align:center;
  background:radial-gradient(ellipse at 50% 30%,#2b3a78,#101836 70%);border:1px solid #f5c76b33;border-radius:14px}
.titlecard small{font-family:Fraunces,serif;font-size:clamp(9px,.9vw,12px);letter-spacing:.2em;color:var(--gold)}
.titlecard em{font-family:Fraunces,serif;font-weight:600;font-size:clamp(13px,1.4vw,19px);line-height:1.15;color:#f8ecd0}

/* list cards (Earlier adventures always; This week on phones) */
.cal.list{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.cal.list .card{flex-direction:row;align-items:center;gap:12px;padding:10px 12px 10px 8px;border-radius:16px;background:#ffffff08;border:1px solid #ffffff14;transition:background .2s,border-color .2s}
.cal.list .card:hover,.cal.list .card:focus-visible{background:#ffffff12;border-color:#f5c76b66}
.cal.list .card:hover .art,.cal.list .card:focus-visible .art{transform:none}
.cal.list .card.today{border-color:var(--gold);background:#f5c76b14;box-shadow:0 0 24px #f5c76b2a}
.cal.list .card .day{flex-direction:column;align-items:center;gap:0;width:38px;flex:0 0 38px;font-size:12px}
.cal.list .card .day b{font-size:22px;line-height:1.1}
.cal.list .card .art{width:66px;flex:0 0 66px;aspect-ratio:1;background-position:center 82%;border-radius:10px;box-shadow:0 6px 16px #0008,0 0 0 1px #ffffff1c}
.cal.list .card.today .art{box-shadow:0 0 0 2px var(--gold),0 6px 16px #0008}
.cal.list .art .ct,.cal.list .card .chip{display:none}
.cal.list .meta{display:flex;flex-direction:column;gap:3px;min-width:0}
.meta b{font-family:Fraunces,serif;font-style:italic;font-weight:600;color:var(--gold);font-size:17px;line-height:1.15}
.meta span{font-size:14px;color:#c7cbe0;line-height:1.25}
.card.done .meta span{color:var(--gold)}

/* book-cover title printed in the picture's calm top area */
.art.ctitle{container-type:inline-size}
.art .ct{position:absolute;left:0;right:0;top:0;padding:9cqw 8cqw 14cqw;text-align:center;background:linear-gradient(#070b1acc,#070b1a00)}
.art .ct small{display:block;font-family:Fraunces,serif;font-size:max(8px,4.4cqw);letter-spacing:.2em;color:var(--gold)}
.art .ct em{display:block;margin-top:2.5cqw;font-family:Fraunces,serif;font-style:italic;font-weight:600;font-size:max(11px,10.5cqw);line-height:1.08;color:var(--gold);text-shadow:0 2px 12px #000c}
@media (max-width:1100px){.cal.list{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .hero{grid-template-columns:minmax(0,200px) 1fr;gap:24px;margin-bottom:36px}
  .hero .cover{transform:none}
  .card .day{font-size:11px;gap:4px}
  .card .day b{font-size:16px}
  .card .chip{font-size:10.5px;padding:1px 7px;bottom:6px}
  .art .ct em{font-size:max(10px,10.5cqw)}
}
@media (max-width:700px){
  .cal,.cal.list{grid-template-columns:minmax(0,1fr);gap:10px}
  .cal .card{flex-direction:row;align-items:center;gap:12px;padding:10px 12px 10px 8px;border-radius:16px;background:#ffffff08;border:1px solid #ffffff14}
  .cal .card:hover .art{transform:none}
  .cal .card.today{border-color:var(--gold);background:#f5c76b14;box-shadow:0 0 24px #f5c76b2a}
  .cal .card .day{flex-direction:column;align-items:center;gap:0;width:38px;flex:0 0 38px;font-size:12px}
  .cal .card .day b{font-size:22px;line-height:1.1}
  .cal .card .art{width:60px;flex:0 0 60px;aspect-ratio:1;background-position:center 82%;border-radius:10px}
  .cal .art .ct,.cal .card .chip{display:none}
  .cal .meta{display:flex;flex-direction:column;gap:3px;min-width:0}
}
@media (max-width:560px){
  .topbar{gap:10px}
  .brand small{display:none}
  .brand b{font-size:19px}
  .stitchbar{gap:7px;font-size:13px}
  .stitchbar .st{gap:3px}
  .stitchbar .st i{width:9px}
  .hero{grid-template-columns:110px minmax(0,1fr);gap:16px;align-items:start}
  .hero .cover{border-radius:12px}
  .hero .info h2{font-size:27px;margin:6px 0 6px}
  .hero .info .sub{font-size:15px;margin-bottom:14px}
  .hero .eyebrow{font-size:11px;letter-spacing:.14em}
  .hero .actions{gap:10px}
  .hero .count{font-size:24px}
  .hero .btn{padding:11px 18px;font-size:16px}
}
/* ---------- library: one month at a time ---------- */
.linkbtn{border:0;background:none;padding:6px 0;font-family:Fraunces,serif;font-style:italic;font-weight:600;font-size:16px;color:var(--gold);text-decoration:underline;text-decoration-color:#f5c76b55;text-underline-offset:4px}
.linkbtn:hover{text-decoration-color:var(--gold)}
.libhead{display:grid;grid-template-columns:1fr auto 1fr;align-items:baseline;gap:6px 16px;margin:4px 0 18px}
.libhead .linkbtn{justify-self:start}
.libhead h2{font-size:clamp(30px,4vw,48px);text-align:center}
.libhead #libCount{justify-self:end;color:var(--gold);font-family:Fraunces,serif;font-size:15px}
.monthnav{display:flex;align-items:center;justify-content:center;gap:clamp(14px,3vw,28px);margin-bottom:18px}
.monthnav h3{font-size:clamp(24px,3vw,34px);min-width:9ch;text-align:center}
.mbtn{width:46px;height:46px;border-radius:50%;border:1px solid #f5c76b66;background:#0b1124b3;color:var(--gold);font-size:26px;line-height:1;display:grid;place-items:center}
.mbtn:disabled{opacity:.25;cursor:default}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:clamp(5px,1vw,12px);max-width:940px;margin:0 auto}
.month .wd{text-align:center;font-family:Fraunces,serif;font-size:13px;letter-spacing:.1em;color:#aab1cf;padding-bottom:4px}
.mcell{position:relative;min-width:0;aspect-ratio:3/4;border-radius:12px;background:#ffffff05;border:0;padding:0;color:inherit;text-align:left}
.mcell.out{visibility:hidden}
.mcell.short{aspect-ratio:auto;height:40px;background:none}
.mcell .num{position:absolute;top:7px;left:9px;z-index:3;font-family:Fraunces,serif;font-size:14px;color:#7d84a3}
.mcell.short .num{top:10px}
.mcell.story{cursor:pointer;background:none}
.mcell.story .num{top:6px;left:6px;padding:1px 8px;border-radius:999px;background:#070b1ad9;color:var(--text);font-size:13px;line-height:1.5}
.mcell.story .art{position:absolute;inset:0;aspect-ratio:auto;border-radius:12px;background:#141d3c center 78%/cover no-repeat;box-shadow:0 8px 20px #0008,0 0 0 1px #ffffff1c;transition:transform .2s,box-shadow .2s}
.mcell.story.v1 .art{background-size:auto 150%;background-position:center 100%}
.mcell.story .art::after{content:"";position:absolute;inset:auto 0 0 0;height:48%;border-radius:0 0 12px 12px;background:linear-gradient(transparent,#070b1af0)}
.mcell.later .art::after{display:none}
.mcell.story:hover .art,.mcell.story:focus-visible .art{transform:translateY(-4px);box-shadow:0 16px 32px #000b,0 0 0 1px #ffffff40}
.mcell .cap{position:absolute;left:8px;right:8px;bottom:8px;z-index:3;font-family:Fraunces,serif;font-style:italic;font-weight:600;font-size:clamp(11px,1.25vw,14px);line-height:1.15;color:#f8ecd0;text-shadow:0 1px 6px #000;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mcell.later{opacity:.55}
.mcell.later .art{background-image:url(art/card-mystery.webp)!important;background-position:center}
.mcell.tomorrow .art{filter:saturate(.8) brightness(.75)}
.mcell.today .art{box-shadow:0 0 0 2px var(--gold),0 0 30px #f5c76b55,0 8px 20px #0008}
.mcell.today .num{background:var(--gold);color:#2a1a06}
.mcell .mark{position:absolute;right:6px;top:6px;z-index:3;height:22px;min-width:22px;padding:0 7px;border-radius:999px;display:grid;place-items:center;font-size:11.5px;font-family:Fraunces,serif;font-weight:600;white-space:nowrap}
.mcell.done .mark{background:var(--gold);color:#2a1a06;padding:0}
.mcell.locked .mark{background:#070b1ad9;border:1px solid #f5c76b77;color:var(--gold)}
.monthlist{display:none}
.mempty{text-align:center;color:#aab1cf}
@media (max-width:700px){
  .month{display:none}
  .monthlist{display:grid}
  .libhead{grid-template-columns:1fr auto}
  .libhead h2{grid-column:1/-1;grid-row:2;text-align:left}
}
/* ---------- modal (cover) ---------- */
.overlay{position:fixed;inset:0;background:#05081acc;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:50;display:grid;place-items:center;padding:20px}
.covercard{width:min(420px,100%);text-align:center}
.coverimg{width:100%;aspect-ratio:2/3;border-radius:14px;background:#141d3c center/cover no-repeat;position:relative;box-shadow:0 20px 60px #000a;overflow:hidden;container-type:inline-size}
.coverimg .ttl{position:absolute;left:0;right:0;top:0;padding:8cqw 7cqw 18cqw;background:linear-gradient(#0e1530f0 55%,transparent)}
.coverimg .ttl small{font-family:Fraunces,serif;font-size:3.4cqw;letter-spacing:.14em;color:var(--gold)}
.coverimg .ttl h3{font-size:8cqw;line-height:1.15;margin-top:1.5cqw}
.lockpill{display:inline-flex;align-items:center;gap:8px;margin:16px 0 6px;padding:8px 16px;border-radius:999px;background:#ffffff10;border:1px solid #f5c76b55;font-family:Fraunces,serif;color:var(--gold)}
.covercard p{color:var(--muted);margin:6px 0 16px}

/* ---------- reader ---------- */
#reader{position:fixed;inset:0;background:#05081a;z-index:60;display:grid;place-items:center}
.page{position:relative;aspect-ratio:2/3;height:min(100vh,150vw);max-width:100vw;container-type:inline-size;overflow:hidden;background:#10182F center/cover no-repeat;user-select:none;-webkit-user-select:none}
.page.noimg{background-image:radial-gradient(1px 1px at 20% 70%,#fff6 50%,transparent 51%),radial-gradient(1px 1px at 70% 80%,#fff5 50%,transparent 51%),radial-gradient(ellipse at 50% 120%,#25356e,#10182F 70%)}
.shade{position:absolute;left:0;right:0;top:0;height:62%;background:linear-gradient(#0e1530e6 0%,#0e1530db 50%,#0e153000 100%);pointer-events:none}
.page.real .shade{background:linear-gradient(#F6EEDCf2 0%,#F6EEDCe8 58%,#F6EEDC00 100%);height:72%}
.txt{position:absolute;left:7.4cqw;right:7.4cqw;top:7.6cqw;font-family:Alegreya,serif;font-size:calc(var(--fs,12) / 432 * 100cqw);line-height:1.25;color:#fff}

</style>
</head>
<body>

<canvas id="sky" aria-hidden="true"></canvas>
<div id="flash" aria-hidden="true"></div>

<!-- LOCK -->
<section id="lock">
  <div class="lockcard" id="lockcard">
    <img class="mark" src="icon-180.png" alt="">
    <h1>The Book of Nights</h1>
    <p>A family storybook that opens one night at a time.</p>
    <form id="lockform" class="plaque" autocomplete="off">
      <span class="kh" aria-hidden="true">🗝️</span>
      <input id="pw" type="password" inputmode="text" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Family password" aria-label="Family password">
      <button class="btn" type="submit">Unlock ✦</button>
    </form>
    <div class="err" id="err" role="alert"></div>
  </div>
</section>

<!-- HOME -->
<main id="home" class="hidden">
  <div class="wrap">
    <div class="topbar">
      <div class="brand"><img src="icon-180.png" alt=""><div><b>The Book of Nights</b><small id="series">Bedtime Adventures</small></div></div>
      <div class="stitchbar"><span class="pill hidden" id="previewPill" title="Every night is unlocked for preview">Preview</span><span class="lbl" id="stitchNote"></span><span class="st" id="stitches"></span></div>
    </div>
    <div id="homeView">
    <section class="hero" id="hero"></section>
    <section class="shelf"><div class="shelf-head"><h3 id="weekTitle">This week</h3><span id="weekSub"></span></div><div class="cal week" id="weekRow"></div></section>
    <section class="shelf" id="earlierShelf"><div class="shelf-head"><h3>Earlier adventures</h3><button class="linkbtn" type="button" data-go="library">See all stories →</button></div><div class="cal list" id="earlierRow"></div></section>
    </div>
    <div id="libraryView" class="hidden">
      <div class="libhead">
        <button class="linkbtn" type="button" data-go="home">← Tonight</button>
        <h2>The Library</h2>
        <span id="libCount"></span>
      </div>
      <div class="monthnav">
        <button class="mbtn" id="mPrev" type="button" aria-label="Previous month">‹</button>
        <h3 id="mTitle" aria-live="polite"></h3>
        <button class="mbtn" id="mNext" type="button" aria-label="Next month">›</button>
      </div>
      <div class="month" id="monthGrid" role="grid"></div>
      <div class="cal list monthlist" id="monthList"></div>
      <p class="mempty hidden" id="mEmpty">No stories this month.</p>
    </div>
  </div>
</main>

<!-- COVER PREVIEW -->
<div class="overlay hidden" id="coverModal" role="dialog" aria-modal="true">
  <div class="covercard">
    <div class="coverimg" id="coverImg"><div class="ttl"><small id="coverLab"></small><h3 id="coverTitle"></h3></div></div>
    <div class="lockpill">🔒 <span id="coverWhen"></span></div>
    <p id="coverCount"></p>
    <button class="btn ghost" id="coverClose" type="button">Back to the calendar</button>
  </div>
</div>

<!-- READER -->
<div id="reader" class="hidden">
  <div class="rbar"><button class="chip" id="rClose" type="button">✕ Close</button><span style="display:flex;gap:8px"><button class="chip sndbtn" id="rSnd" type="button" aria-label="Sound volume: loud, medium, soft or off">🔊 Sounds</button><span class="chip" id="rPos"></span></span></div>
  <button class="navbtn prev" id="rPrev" type="button" aria-label="Previous page">‹</button>
  <div class="page" id="page"></div>
  <button class="navbtn next" id="rNext" type="button" aria-label="Next page">›</button>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const STORE = "bookofnights.";
let M = null, KEY = null, META = null, serverSkew = 0;
const covers = {}, stories = {};

/* ---------- crypto ---------- */
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function derive(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(M.salt), iterations: M.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}
async function decrypt(buf, key = KEY) {
  const u = new Uint8Array(buf);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: u.slice(0, 12) }, key, u.slice(12));
  return JSON.parse(new TextDecoder().decode(plain));
}
async function fetchBin(name) {
  const r = await fetch("data/" + name);
  if (!r.ok) throw new Error("missing " + name);
  return decrypt(await r.arrayBuffer());
}

/* ---------- time: always the family time zone (from the manifest), server clock when online ---------- */
const now = () => Date.now() + serverSkew;
function tzOffsetMin(ts, tz) {
  const parts = new Intl.DateTimeFormat("en-US", { timeZone: tz, timeZoneName: "shortOffset" }).formatToParts(new Date(ts));
  const v = (parts.find((p) => p.type === "timeZoneName") || {}).value || "GMT";
  const m = v.match(/GMT([+-]\d+)(?::(\d+))?/);
  return m ? (parseInt(m[1], 10) * 60 + Math.sign(parseInt(m[1], 10)) * (parseInt(m[2] || "0", 10))) : 0;
}
function localToUTC(dateStr, hour, tz) {
  const [y, mo, d] = dateStr.split("-").map(Number);
  let guess = Date.UTC(y, mo - 1, d, hour, 0, 0);
  for (let i = 0; i < 2; i++) guess = Date.UTC(y, mo - 1, d, hour, 0, 0) - tzOffsetMin(guess, tz) * 60000;
  return guess;
}
const ymd = (ts) => new Intl.DateTimeFormat("en-CA", { timeZone: M.tz }).format(new Date(ts));
const addDays = (s, k) => { const [y, m, d] = s.split("-").map(Number); return new Date(Date.UTC(y, m - 1, d + k)).toISOString().slice(0, 10); };
function stateOf(night) {
  if (M.preview) return "open";
  const t = now(), unlock = localToUTC(night.date, M.unlockHour, M.tz), today = ymd(t);
  if (t >= unlock) return "open";
  if (night.date === today) return "tonight";
  if (night.date === addDays(today, 1)) return "tomorrow";
  return "later";
}
function fmtCountdown(ms) {
  if (ms <= 0) return "now";
  const h = Math.floor(ms / 3600000), m = Math.floor((ms % 3600000) / 60000), s = Math.floor((ms % 60000) / 1000);
  return h > 0 ? `${h}h ${String(m).padStart(2, "0")}m` : `${m}m ${String(s).padStart(2, "0")}s`;
}
const dayName = (dateStr) => new Date(dateStr + "T12:00:00Z").toLocaleDateString("en-US", { weekday: "long", timeZone: "UTC" });

/* ---------- boot ---------- */
async function boot() {
  const r = await fetch("data/manifest.json", { cache: "no-store" });
  M = await r.json();
  const sd = r.headers.get("Date");
  if (sd) { const skew = Date.parse(sd) - Date.now(); if (Math.abs(skew) > 120000) serverSkew = skew; }
  const saved = localStorage.getItem(STORE + "key");
  if (saved) {
    try {
      KEY = await crypto.subtle.importKey("raw", b64(saved), "AES-GCM", true, ["decrypt"]);
      await decrypt(b64(M.check).buffer);
      return enter();
    } catch (e) { localStorage.removeItem(STORE + "key"); KEY = null; }
  }
  $("pw").focus();
}
$("lockform").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("err").textContent = "Opening the book…";
  try {
    const k = await derive($("pw").value.trim());
    await decrypt(b64(M.check).buffer, k);
    KEY = k;
    const raw = new Uint8Array(await crypto.subtle.exportKey("raw", k));
    localStorage.setItem(STORE + "key", btoa(String.fromCharCode(...raw)));
    $("err").textContent = "";
    $("flash").classList.add("on");
    setTimeout(() => { enter(); setTimeout(() => $("flash").classList.remove("on"), 150); }, 650);
  } catch (err) {
    $("err").textContent = "That's not the family password. Try again!";
    const c = $("lockcard"); c.classList.remove("shake"); void c.offsetWidth; c.classList.add("shake");
  }
});

async function enter() {
  $("lock").classList.add("hidden"); $("home").classList.remove("hidden");
  try { META = await fetchBin("meta.bin"); } catch (e) {}
  await loadCovers(homeNights());
  route();
  addEventListener("hashchange", route);
  setInterval(render, 1000 * 20);
  setInterval(tickCountdowns, 1000);
}

/* ---------- covers load only when needed (home: this week + a few earlier; library: one month) ---------- */
const coverJobs = {};
function loadCovers(list) {
  return Promise.all(list.map((n) => coverJobs[n.n] || (coverJobs[n.n] = fetchBin(`n${String(n.n).padStart(2, "0")}-cover.bin`)
    .then((c) => { covers[n.n] = c; }).catch(() => { delete coverJobs[n.n]; }))));
}
const EARLIER_ON_HOME = 4;
/* "this week" = the week of tonight's night (or the next one coming); the season = its gold stitches/frames */
function anchorNight() {
  const t = ymd(now());
  return M.nights.find((n) => n.date === t) || M.nights.find((n) => n.date > t) || M.nights[M.nights.length - 1];
}
function thisWeek() { const a = anchorNight(); return M.nights.filter((n) => n.week === a.week); }
function thisSeason() { const a = anchorNight(); return M.nights.filter((n) => (n.season || 0) === (a.season || 0)); }
const markWord = (season) => (season >= 2 ? "frame" : "stitch");
function homeNights() {
  const week = thisWeek(), earlier = M.nights.filter((n) => n.date < (week[0] || {}).date);
  return [...week, ...earlier.slice(-EARLIER_ON_HOME)];
}

/* ---------- views: #library/YYYY-MM shows the month calendar; anything else is home ---------- */
function route() {
  const lib = location.hash.startsWith("#library");
  $("homeView").classList.toggle("hidden", lib);
  $("libraryView").classList.toggle("hidden", !lib);
  if (lib) { const m = location.hash.split("/")[1]; LIB.month = storyMonths().includes(m) ? m : defaultMonth(); }
  render();
  scrollTo(0, 0);
}
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-go]"); if (!b) return;
  location.hash = b.dataset.go === "library" ? "#library/" + (LIB.month || defaultMonth()) : "";
});

/* ---------- home ---------- */
function shortTitle(title) {
  const pre = (META && META.prefix) || "";
  const t = pre && title.startsWith(pre) ? title.slice(pre.length) : title;
  return t.charAt(0).toUpperCase() + t.slice(1);        // "the Race…" -> "The Race…"
}
/* nights already read on this device (Volume One was read before the website existed) */
function readSet() { try { return new Set(JSON.parse(localStorage.getItem(STORE + "read") || "[1,2,3,4]")); } catch (e) { return new Set([1, 2, 3, 4]); } }
function markRead(n) {
  const r = readSet(); if (r.has(n)) return false;
  r.add(n); try { localStorage.setItem(STORE + "read", JSON.stringify([...r])); } catch (e) {}
  return true;
}
/* night names for any number: 12 -> "Twelve", 42 -> "Forty-Two" */
const NIGHT_WORD = new Proxy({}, { get: (_, k) => {
  const n = Number(k); if (!Number.isInteger(n) || n < 1) return String(k);
  const ones = ["", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine", "Ten", "Eleven", "Twelve", "Thirteen", "Fourteen", "Fifteen", "Sixteen", "Seventeen", "Eighteen", "Nineteen"];
  const tens = ["", "", "Twenty", "Thirty", "Forty", "Fifty", "Sixty", "Seventy", "Eighty", "Ninety"];
  if (n < 20) return ones[n];
  if (n < 100) return tens[Math.floor(n / 10)] + (n % 10 ? "-" + ones[n % 10] : "");
  return ones[Math.floor(n / 100)] + " Hundred" + (n % 100 ? " " + NIGHT_WORD[n % 100] : "");
} });
const longDate = (ds) => new Date(ds + "T12:00:00Z").toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", timeZone: "UTC" });
function artFor(night, extraClass = "") {
  const cv = covers[night.n] || {};
  if (cv.img && cv.baked) return `<div class="art ${extraClass}" style="background-image:url(${cv.img})">`;
  if (cv.img) return `<div class="art ctitle ${extraClass}" style="background-image:url(${cv.img})"><div class="ct"><small>NIGHT ${NIGHT_WORD[night.n].toUpperCase()}</small><em>${shortTitle(cv.title || "")}</em></div>`;
  return `<div class="art ${extraClass}"><div class="titlecard"><small>NIGHT ${NIGHT_WORD[night.n].toUpperCase()}</small><em>${cv.title ? shortTitle(cv.title) : ""}</em></div>`;
}
function cardHTML(night) {
  const s = stateOf(night), cv = covers[night.n] || {}, today = night.date === ymd(now());
  const done = s === "open" && readSet().has(night.n);
  const d = new Date(night.date + "T12:00:00Z");
  const wd = d.toLocaleDateString("en-US", { weekday: "short", timeZone: "UTC" }).toUpperCase();
  const wdLong = dayName(night.date);
  const chip = done ? "✓ Read" : s === "open" ? (today ? "Tonight ✦" : "Open") : today ? "Tonight" : s === "tomorrow" ? "🔒 9 pm" : "Opens " + d.toLocaleDateString("en-US", { weekday: "short", timeZone: "UTC" });
  const status = done ? ((night.season || 0) >= 1 ? "✓ Read · gold " + markWord(night.season) + " earned" : "✓ Read") : s === "open" ? (today ? "Open now ✦" : "Ready to read")
    : today ? "Tonight at 9:00 pm" : s === "tomorrow" ? "🔒 Opens tomorrow at 9:00 pm" : `Opens ${wdLong} at 9:00 pm`;
  const title = s === "later" ? "A surprise…" : shortTitle(cv.title || "");
  const inner = s === "later" ? `<div class="art">` : artFor(night);
  return `<button type="button" class="card ${s}${today ? " today" : ""}${done ? " done" : ""}" data-n="${night.n}" aria-label="${wdLong} ${d.getUTCDate()}: ${title}. ${status}">
      <span class="day"><span>${wd}</span><b>${d.getUTCDate()}</b></span>
      ${inner}<span class="chip">${chip}</span></div>
      <span class="meta"><b>${title}</b><span>Night ${NIGHT_WORD[night.n]} · ${status}</span></span></button>`;
}
function render() {
  const week = thisWeek(), earlier = M.nights.filter((n) => n.date < (week[0] || {}).date).slice(-EARLIER_ON_HOME);
  const season = thisSeason(), sw = markWord((anchorNight().season) || 0);
  const rs = readSet(), readCount = season.filter((n) => stateOf(n) === "open" && rs.has(n.n)).length;
  $("stitches").innerHTML = season.map((n) => `<i class="${stateOf(n) === "open" && rs.has(n.n) ? "on" : ""}" title="Night ${NIGHT_WORD[n.n] || n.n}"></i>`).join("");
  $("stitchNote").textContent = innerWidth < 560 ? `${readCount}/${season.length} ✦` : `${readCount} of ${season.length} gold ${sw}s`;
  $("previewPill").classList.toggle("hidden", !M.preview);
  if (META && META.series) $("series").textContent = META.series;
  // ---- tonight hero ----
  const todayStr = ymd(now());
  const hero = M.nights.find((n) => n.date === todayStr) || week.find((n) => stateOf(n) !== "open") || [...M.nights].reverse().find((n) => stateOf(n) === "open");
  if (hero) {
    const s = stateOf(hero), cv = covers[hero.n] || {}, isToday = hero.date === todayStr;
    const unlock = localToUTC(hero.date, M.unlockHour, M.tz);
    const action = s === "open"
      ? `<button class="btn" type="button" id="heroOpen">Open the book ✦</button>`
      : `<div class="count" data-unlock="${unlock}">${fmtCountdown(unlock - now())}<small>until the book opens at 9:00 pm</small></div><button class="btn ghost" type="button" id="heroPeek">Peek at the cover</button>`;
    $("hero").innerHTML = `<div class="cover art" role="img" aria-label="Cover" style="background-image:url(${cv.img || ""})"></div>
      <div class="info"><div class="eyebrow">${isToday ? "Tonight" : "Next"} · ${longDate(hero.date)}</div>
        <h2>${cv.title ? shortTitle(cv.title).replace(/^the /, "The ") : ""}</h2>
        <div class="sub">Night ${NIGHT_WORD[hero.n]} · ${cv.subtitle || ""}</div>
        <div class="actions">${action}</div></div>`;
    const cover = $("hero").querySelector(".cover");
    cover.onclick = () => (s === "open" ? openReader(hero) : showCover(hero));
    if ($("heroOpen")) $("heroOpen").onclick = () => openReader(hero);
    if ($("heroPeek")) $("heroPeek").onclick = () => showCover(hero);
  }
  // ---- shelves ----
  const first = week[0], last = week[week.length - 1];
  $("weekTitle").textContent = "This week · " + ((M.weekNames || {})[anchorNight().week] || "Adventures");
  $("weekSub").textContent = first ? `${longDate(first.date).split(", ")[1]} – ${longDate(last.date).split(", ")[1]}` : "";
  $("weekRow").innerHTML = week.map(cardHTML).join("");
  $("earlierRow").innerHTML = earlier.map(cardHTML).join("");
  if (!$("libraryView").classList.contains("hidden")) renderLibrary();
}
/* one click handler for every story card, on home and in the library */
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-n]"); if (!el || !M) return;
  const night = M.nights.find((n) => n.n === Number(el.dataset.n)), s = stateOf(night);
  if (s === "open") openReader(night); else if (s === "later") surprise(night); else showCover(night);
});

/* ---------- library: a real month calendar ---------- */
const LIB = { month: null };
const monthOf = (ds) => ds.slice(0, 7);
function storyMonths() { return [...new Set(M.nights.map((n) => monthOf(n.date)))].sort(); }
function defaultMonth() {
  const ms = storyMonths(), cur = monthOf(ymd(now()));
  return ms.includes(cur) ? cur : ms.filter((m) => m <= cur).pop() || ms[0];
}
const monthName = (m) => new Date(m + "-15T12:00:00Z").toLocaleDateString("en-US", { month: "long", year: "numeric", timeZone: "UTC" });
let libToken = 0;
async function renderLibrary() {
  const m = LIB.month, ms = storyMonths();
  const inMonth = M.nights.filter((n) => monthOf(n.date) === m);
  const token = ++libToken;
  $("mTitle").textContent = monthName(m);
  $("mPrev").disabled = !(m > ms[0]); $("mNext").disabled = !(m < ms[ms.length - 1]);
  const rs = readSet(), got = inMonth.filter((n) => stateOf(n) === "open" && rs.has(n.n)).length;
  $("libCount").textContent = inMonth.length ? `${got} of ${inMonth.length} read ✦` : "";
  $("mEmpty").classList.toggle("hidden", inMonth.length > 0);
  if (inMonth.some((n) => !covers[n.n])) { drawMonth(m, inMonth); await loadCovers(inMonth); if (token !== libToken) return; }

}
function drawMonth(m, inMonth) {
  const [y, mo] = m.split("-").map(Number), first = new Date(Date.UTC(y, mo - 1, 1)), days = new Date(Date.UTC(y, mo, 0)).getUTCDate();
  const byDate = Object.fromEntries(inMonth.map((n) => [n.date, n])), todayStr = ymd(now()), rs = readSet();
  // weeks with no story shrink to a thin row of dates, so the stories fill the screen
  const weekHasStory = (ds) => { const t = new Date(ds + "T12:00:00Z"), sun = new Date(t - t.getUTCDay() * 864e5);
    for (let k = 0; k < 7; k++) { const x = new Date(+sun + k * 864e5).toISOString().slice(0, 10); if (byDate[x]) return true; } return false; };
  let html = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"].map((d) => `<div class="wd" role="columnheader">${d}</div>`).join("");
  const lead = weekHasStory(`${m}-01`) ? "" : " short";
  for (let k = 0; k < first.getUTCDay(); k++) html += `<div class="mcell out${lead}" aria-hidden="true"></div>`;
  for (let d = 1; d <= days; d++) {

    const short = !weekHasStory(ds) ? " short" : "";

    const s = stateOf(n), cv = covers[n.n] || {}, done = s === "open" && rs.has(n.n);
    const title = s === "later" ? "A surprise" : shortTitle(cv.title || "Night " + n.n);
    const mark = done ? "✓" : today && s !== "open" ? "Tonight" : s === "tomorrow" ? "🔒" : "";
    html += `<button type="button" class="mcell story ${s}${done ? " done" : ""}${s !== "open" ? " locked" : ""}${today ? " today" : ""}${n.week === 1 ? " v1" : ""}" data-n="${n.n}" aria-label="${dayName(ds)} ${d}: ${title}${done ? ", read" : ""}">
      <div class="art" style="${s !== "later" && cv.img ? `background-image:url(${cv.img})` : ""}"></div><span class="num">${d}</span>${mark ? `<span class="mark">${mark}</span>` : ""}${s !== "later" ? `<span class="cap">${title}</span>` : ""}</button>`;
  }

  const trail = weekHasStory(`${m}-${String(days).padStart(2, "0")}`) ? "" : " short";
  for (let k = 0; k < tail; k++) html += `<div class="mcell out${trail}" aria-hidden="true"></div>`;

}
$("mPrev").onclick = () => { const ms = storyMonths(), i = ms.indexOf(LIB.month); if (i > 0) location.hash = "#library/" + ms[i - 1]; };
$("mNext").onclick = () => { const ms = storyMonths(), i = ms.indexOf(LIB.month); if (i < ms.length - 1) location.hash = "#library/" + ms[i + 1]; };
function tickCountdowns() {
  document.querySelectorAll("[data-unlock]").forEach((el) => {
    const ms = Number(el.dataset.unlock) - now();

}

/* ---------- twinkling night sky (calm; still when reduced motion is on) ---------- */
(function sky() {
  const cv = $("sky"), ctx2 = cv.getContext("2d");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let stars = [];
  function size() {
    cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio;
    stars = Array.from({ length: Math.round(innerWidth * innerHeight / 9000) }, () => ({
      x: Math.random() * cv.width, y: Math.random() * cv.height * 0.75, r: (Math.random() * 1.2 + 0.3) * devicePixelRatio,
      p: Math.random() * 6.28, s: 0.4 + Math.random() * 1.2, g: Math.random() < 0.18 }));
  }
  function frame(tm) {
    ctx2.clearRect(0, 0, cv.width, cv.height);
    for (const st of stars) {
      const a = still ? 0.6 : 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(st.p + tm / 1000 * st.s));
      ctx2.fillStyle = st.g ? `rgba(255,224,160,${a})` : `rgba(255,255,255,${a * 0.8})`;
      ctx2.beginPath(); ctx2.arc(st.x, st.y, st.r, 0, 6.29); ctx2.fill();
    }
    if (!still) requestAnimationFrame(frame);
  }
  addEventListener("resize", size); size(); requestAnimationFrame(frame);
})();
/* ---------- cover preview (tonight before 9 pm, and tomorrow) ---------- */
function showCover(night) {

  $("coverLab").textContent = cv.label || "NIGHT " + night.n;
  $("coverTitle").innerHTML = cv.title || "";
  const unlock = localToUTC(night.date, M.unlockHour, M.tz);
  $("coverWhen").textContent = `Opens ${stateOf(night) === "tonight" ? "tonight" : dayName(night.date)} at 9:00 pm`;
  $("coverCount").innerHTML = `The book opens in <span class="count" style="font-size:20px" data-unlock="${unlock}">${fmtCountdown(unlock - now())}</span>`;
  $("coverModal").classList.remove("hidden");
}
function surprise(night) {
  $("coverImg").style.backgroundImage = "";
  $("coverLab").textContent = "NIGHT " + night.n;
  $("coverTitle").textContent = "It's a surprise…";
  $("coverWhen").textContent = `${dayName(night.date)} at 9:00 pm`;
  $("coverCount").textContent = "You'll see the cover the night before. No peeking, explorers!";

}
$("coverClose").onclick = () => $("coverModal").classList.add("hidden");
$("coverModal").addEventListener("click", (e) => { if (e.target.id === "coverModal") $("coverModal").classList.add("hidden"); });

/* ---------- reader ---------- */
let R = { story: null, i: 0 };
async function openReader(night) {
  if (stateOf(night) !== "open") return showCover(night);
  SFX.unlock();
  SFX.stop();
  const key = `n${String(night.n).padStart(2, "0")}-story.bin`;
  R = { story: null, i: 0 };            // forget the previous story completely
  $("rPos").textContent = "…";
  $("reader").classList.remove("hidden");
  $("page").innerHTML = `<div class="txt" style="text-align:center;top:40%">Opening the book…</div>`;
  if (!stories[night.n]) stories[night.n] = await fetchBin(key);
  R = { story: stories[night.n], i: 0 };   // a story ALWAYS opens on its first page
  SFX.load(R.story);
  draw();
}
function draw() {
  const pages = R.story.pages, el = $("page");
  if (R.i >= pages.length) return drawEnd();
  const p = pages[R.i];
  el.className = "page " + p.kind + (p.img ? "" : " noimg") + (p.tpl && p.kind === "story" ? " " + p.tpl : "");
  el.style.setProperty("--fs", p.fs || 12);
  el.style.backgroundImage = p.img ? `url(${p.img})` : "";
  let inner = "";
  if (p.kind === "flat") {
    el.innerHTML = "";
    $("rPos").textContent = `${R.i + 1} / ${pages.length}`;
    $("rPrev").style.visibility = R.i === 0 ? "hidden" : "visible";
    SFX.page(p.snd);
    return;
  }
  SFX.page(p.snd); PACE.shown = performance.now();
  if (p.kind === "title") {
    const [lab, big, sub] = p.paras.map((x) => x.h);
    inner = `<div class="txt"><div class="lab">${lab || ""}</div><div class="big">${big || ""}</div><div class="div">— ✦ —</div><div class="sub">${sub || ""}</div></div>`;
  } else {
    const head = p.heading ? `<h4>${p.heading}</h4>` : "";
    const body = p.paras.map((x, j) => (p.kind === "real" && j === 0) ? `<h4>${x.h}</h4>` : `<p class="${x.pause ? "pause" : ""}">${x.h}</p>`).join("");
    inner = `<div class="txt">${head}${body}</div>`;
  }
  el.innerHTML = `<div class="shade"></div>${inner}<div class="pnum">${p.num}</div>`;
  $("rPos").textContent = `${R.i + 1} / ${pages.length}`;
  $("rPrev").style.visibility = R.i === 0 ? "hidden" : "visible";
}
function drawEnd() {
  const OLDER = (META && META.older) || "Big brother", YOUNGER = (META && META.younger) || "Little brother";
  SFX.page({ place: "bedroom_night", life: null, m: [] });
  const n = R.story.n, saved = JSON.parse(localStorage.getItem(STORE + "fb" + n) || "{}");
  const fresh = markRead(n), night = M.nights.find((x) => x.n === n);
  const wk = M.nights.filter((x) => (x.season || 0) === (night.season || 0)), rs = readSet(), got = wk.filter((x) => rs.has(x.n)).length;
  const mw = markWord(night.season || 0);
  const stitch = (night.season || 0) >= 1 ? `<div class="newstitch${fresh ? " fresh" : ""}"><span class="st">${wk.map((x) => `<i class="${rs.has(x.n) ? "on" : ""}${x.n === n ? " me" : ""}"></i>`).join("")}</span>${fresh ? "A new gold " + mw + "!" : "Gold " + mw + " earned"} · ${got} of ${wk.length}</div>` : "";
  render();
  const el = $("page"); el.className = "page noimg"; el.style.backgroundImage = "";
  el.innerHTML = `<div class="endcard"><h3>The End</h3>${stitch}
    <label for="fbM">${OLDER}'s best moment tonight</label><textarea id="fbM">${saved.m || ""}</textarea>
    <label for="fbL">${YOUNGER}'s best moment tonight</label><textarea id="fbL">${saved.l || ""}</textarea>
    <label for="fbN">What should happen next time?</label><textarea id="fbN">${saved.x || ""}</textarea>
    <div class="row"><button class="btn" id="fbSend" type="button">Send to Dad</button><button class="btn ghost" id="fbAgain" type="button">Read again</button></div></div>`;
  $("rPos").textContent = "The End";
  const collect = () => ({ m: $("fbM").value.trim(), l: $("fbL").value.trim(), x: $("fbN").value.trim() });
  ["fbM", "fbL", "fbN"].forEach((id) => $(id).addEventListener("input", () => localStorage.setItem(STORE + "fb" + n, JSON.stringify(collect()))));
  $("fbAgain").onclick = () => { R.i = 0; draw(); };
  $("fbSend").onclick = async () => {
    const f = collect();
    const text = `Night ${n} · ${R.story.title.replace(/<[^>]+>/g, "")}\n${OLDER}'s best moment: ${f.m}\n${YOUNGER}'s best moment: ${f.l}\nNext time: ${f.x}`;
    try { if (navigator.share) { await navigator.share({ text }); return; } } catch (e) { return; }

}
/* Dad's reading speed: learned from how long each page stays open, so the sounds land on the right words */
const PACE = { shown: 0, cps: (() => { try { return Number(localStorage.getItem(STORE + "readcps")) || 13; } catch (e) { return 13; } })() };
function learnPace() {
  const p = R.story && R.story.pages[R.i]; if (!p || !p.snd || !p.snd.n || p.kind !== "story" || !PACE.shown) return;
  const sec = (performance.now() - PACE.shown) / 1000, n = p.snd.n;
  if (n < 150 || sec < n / 30 || sec > n / 5) return;            // skipped or left open: not a real reading
  const sample = Math.min(22, Math.max(7, n / sec));
  PACE.cps = Math.round((PACE.cps * 0.75 + sample * 0.25) * 10) / 10;
  try { localStorage.setItem(STORE + "readcps", PACE.cps); } catch (e) {}
}
const go = (d) => { if (!R.story) return; if (d > 0) learnPace(); const max = R.story.pages.length; R.i = Math.max(0, Math.min(max, R.i + d)); draw(); };
$("rNext").onclick = () => go(1); $("rPrev").onclick = () => go(-1);
$("rClose").onclick = () => { SFX.stop(); $("reader").classList.add("hidden"); render(); };
$("rSnd").onclick = () => { SFX.cycle(); };
document.addEventListener("keydown", (e) => {
  if ($("reader").classList.contains("hidden")) return;
  if (e.key === "ArrowRight" || e.key === " ") go(1); else if (e.key === "ArrowLeft") go(-1); else if (e.key === "Escape") $("rClose").onclick();
});
let sx = null;
$("page").addEventListener("pointerdown", (e) => { sx = e.clientX; });
$("page").addEventListener("pointerup", (e) => {
  if (sx === null || e.target.closest("textarea,button")) { sx = null; return; }
  const dx = e.clientX - sx; sx = null;
  if (Math.abs(dx) > 40) go(dx < 0 ? 1 : -1);
  else { const r = $("page").getBoundingClientRect(); go(e.clientX - r.left > r.width / 2 ? 1 : -1); }
});


/* ---------- SOUNDSCAPES: generated live with Web Audio (no audio files, no outside services) ---------- */
const SFX = (() => {
  /* Real recorded sounds (BBC archive + NASA), decrypted per night; magic stays generated.
     Each page: place (loop) + life (loop) + moments timed to when Dad reads those words. */
  let ctx = null, master = null, noiseBuf = null;
  const LEVELS = [1, 0.6, 0.3, 0], ICONS = ["🔊", "🔉", "🔈", "🔇"], BASE = 0.9;
  let lvl = Number(localStorage.getItem(STORE + "soundlvl") || (localStorage.getItem(STORE + "sound") === "off" ? 3 : 0)) || 0;
  const buffers = {}, loading = {}; let META = {}, current = { place: null, life: null }, timers = [], token = 0;
  function label() { $("rSnd").textContent = `${ICONS[lvl]} Sounds`; $("rSnd").classList.toggle("off", lvl === 3); }
  function unlock() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      ctx = new AC(); master = ctx.createGain(); master.gain.value = BASE * LEVELS[lvl]; master.connect(ctx.destination);
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ctx.state === "suspended") ctx.resume();
    label();
  }
  const gain = (v) => { const g = ctx.createGain(); g.gain.value = v; return g; };
  const filt = (type, f, q = 0.7) => { const x = ctx.createBiquadFilter(); x.type = type; x.frequency.value = f; x.Q.value = q; return x; };
  const ping = (out, f, dur, vol) => { const o = ctx.createOscillator(), g = gain(0), t0 = ctx.currentTime; o.frequency.value = f;
    g.gain.linearRampToValueAtTime(vol, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur); o.connect(g).connect(out); o.start(t0); o.stop(t0 + dur + 0.05); };
  /* generated magic (no real-world recording exists for magic) */
  const SYN = {
    chime: (o) => [1046, 1318, 1568, 2093].forEach((f, k) => setTimeout(() => ping(o, f, 1.8, 0.07), k * 150)),
    whoosh: (o) => { const s = ctx.createBufferSource(); s.buffer = noiseBuf; const f = filt("bandpass", 300, 1.2), g = gain(0), t0 = ctx.currentTime;
      f.frequency.exponentialRampToValueAtTime(3200, t0 + 0.9); g.gain.linearRampToValueAtTime(0.35, t0 + 0.35); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.1);
      s.connect(f).connect(g).connect(o); s.start(t0); s.stop(t0 + 1.2); },
    zap: (o) => { const s = ctx.createOscillator(), g = gain(0), t0 = ctx.currentTime; s.type = "sawtooth"; s.frequency.setValueAtTime(1400, t0); s.frequency.exponentialRampToValueAtTime(180, t0 + 0.35);
      g.gain.linearRampToValueAtTime(0.06, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.35); s.connect(g).connect(o); s.start(t0); s.stop(t0 + 0.4); },
  };
  function magicLoop(out) {            // gentle sparkle notes, used for magic travel
    const notes = [1046, 1175, 1318, 1568, 1760, 2093], ids = [];
    const go = () => { ping(out, notes[Math.floor(Math.random() * notes.length)], 1.6, 0.04); ids.push(setTimeout(go, 500 + Math.random() * 1000)); };
    ids.push(setTimeout(go, 200));
    return { stop: () => ids.forEach(clearTimeout) };
  }
  /* loading: each night's sounds are encrypted like the stories */
  function load(story) {
    META = story.sounds || {};
    Object.entries(META).forEach(([id, m]) => { if (m.file) get(id); });
  }
  function get(id) {
    const m = META[id]; if (!m || !m.file || !ctx) return Promise.resolve(null);
    if (buffers[id]) return Promise.resolve(buffers[id]);
    if (!loading[id]) loading[id] = fetch("data/" + m.file).then((r) => r.arrayBuffer()).then(async (buf) => {
      const u = new Uint8Array(buf);
      const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: u.slice(0, 12) }, KEY, u.slice(12));
      return new Promise((ok, bad) => ctx.decodeAudioData(plain, ok, bad));
    }).then((b) => (buffers[id] = b)).catch(() => { delete loading[id]; return null; });
    return loading[id];
  }
  function startLoop(id, vol) {
    const m = META[id]; if (!m) return null;
    const out = gain(0); out.connect(master);
    const L = { id, out, stop: null };
    if (m.synth) { const s = magicLoop(out); L.stop = s.stop; }
    else {
      get(id).then((b) => {
        if (!b || L.dead) return;
        const src = ctx.createBufferSource(); src.buffer = b; src.loop = true;
        src.loopStart = m.loopStart || 0; src.loopEnd = m.loopEnd || b.duration;
        src.connect(out); src.start(0, (m.loopStart || 0) + Math.random() * Math.max(0, (m.loopEnd || b.duration) - (m.loopStart || 0) - 1));
        L.stop = () => { try { src.stop(); } catch (e) {} };
      });
    }
    out.gain.linearRampToValueAtTime(vol * (m.vol || 1), ctx.currentTime + 1.8);

  }
  function endLoop(L, fade = 1.6) {

    const m = META[id]; if (!m || !ctx) return;
    const out = gain(vol * (m.vol || 1)); out.connect(master);
    if (m.synth) { const k = m.synth.split(":")[1]; (SYN[k] || SYN.chime)(out); setTimeout(() => out.disconnect(), 4000); return; }
    get(id).then((b) => { if (!b) return; const src = ctx.createBufferSource(); src.buffer = b; src.connect(out); src.start(); src.onended = () => out.disconnect(); });
  }
  const MOMENT_VOL = { soft: 0.6, normal: 1, big: 1.1 };
  function page(snd) {
    if (!ctx) return;
    timers.forEach(clearTimeout); timers = []; const my = ++token;
    snd = snd || { place: null, life: null, m: [] };
    for (const slot of ["place", "life"]) {
      const want = snd[slot] && META[snd[slot]] ? snd[slot] : null;
      if (current[slot] && current[slot].id === want) continue;           // same place: keep it playing smoothly
      endLoop(current[slot]); current[slot] = want ? startLoop(want, slot === "life" ? 0.9 : 1) : null;
    }
    (snd.m || []).forEach((m) => { if (META[m.id]) timers.push(setTimeout(() => { if (my === token) shot(m.id, MOMENT_VOL[snd.vol] || 1); }, (m.c != null ? Math.max(0.6, Math.min(80, m.c / PACE.cps)) : (m.at || 0.6)) * 1000)); });
  }
  function stop() { if (!ctx) return; timers.forEach(clearTimeout); timers = []; token++; endLoop(current.place, 0.8); endLoop(current.life, 0.8); current = { place: null, life: null }; }
  function cycle() { unlock(); lvl = (lvl + 1) % LEVELS.length; localStorage.setItem(STORE + "soundlvl", lvl);
    master.gain.linearRampToValueAtTime(BASE * LEVELS[lvl], ctx.currentTime + 0.3); label(); }
  const state = () => ({ place: current.place && current.place.id, life: current.life && current.life.id, pending: timers.length, loaded: Object.keys(buffers).length, level: LEVELS[lvl] });
  return { unlock, load, page, stop, cycle, state };
})();
